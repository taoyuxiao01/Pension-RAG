services:
  ollama:
    image: ollama/ollama:latest
    container_name: pension-ollama
    volumes:
      - ollama_data:/root/.ollama
    expose:
      - "11434"
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  ollama-init:
    image: ollama/ollama:latest
    container_name: pension-ollama-init
    volumes:
      - ollama_data:/root/.ollama
      - ./scripts/ollama-init.sh:/ollama-init.sh:ro
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_CHAT_MODEL=qwen3.5:9b-q4_K_M
      - OLLAMA_EMBED_MODEL=bge-m3
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/ollama-init.sh"]
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: pension-backend
    expose:
      - "8000"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_CHAT_MODEL=qwen3.5:9b-q4_K_M
      - OLLAMA_EMBED_MODEL=bge-m3
    depends_on:
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: pension-frontend
    expose:
      - "8501"
    environment:
      - API_URL=http://backend:8000
      - IMAGE_DISPLAY_WIDTH=48
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: pension-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  ollama_data:
